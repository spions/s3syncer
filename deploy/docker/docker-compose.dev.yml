---

services:
  minio1:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-10-15T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testtest
      MINIO_ROOT_PASSWORD: testtest
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio2:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-10-15T00-00-00Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testtest
      MINIO_ROOT_PASSWORD: testtest
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set m1 http://minio1:9000 testtest testtest &&
      mc alias set m2 http://minio2:9000 testtest testtest &&
      mc mb --ignore-existing m1/testsync1 &&
      mc mb --ignore-existing m2/testsync2 &&
      echo 'Buckets created'
      "

  s3syncer:
    build: ../..
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - ../../tests/config.docker.yaml:/config.yaml
    command: ["-config", "/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  geesefs-test:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.geesefs
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - ../../data:/data
    depends_on:
      - s3syncer
    environment:
      - AWS_ACCESS_KEY_ID=testtest
      - AWS_SECRET_ACCESS_KEY=testtest

  geesefs-dirtest:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.geesefs
    entrypoint: ["/test-directory-persistence.sh"]
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - ../../data:/data
    depends_on:
      - s3syncer
    environment:
      - AWS_ACCESS_KEY_ID=testtest
      - AWS_SECRET_ACCESS_KEY=testtest

  geesefs-paginated-symlink-test:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.geesefs
    entrypoint: ["/test-paginated-symlinks.sh"]
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - ../../data:/data
    depends_on:
      - s3syncer
    environment:
      - AWS_ACCESS_KEY_ID=testtest
      - AWS_SECRET_ACCESS_KEY=testtest

  aws-cli-test:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.geesefs
    entrypoint: ["/test-aws-cli.sh"]
    depends_on:
      s3syncer:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=testtest
      - AWS_SECRET_ACCESS_KEY=testtest
      - AWS_DEFAULT_REGION=us-east-1

  test-replication:
    build:
      context: ../..
      dockerfile: tests/Dockerfile.replication
    depends_on:
      - s3syncer
    environment:
      - TEST_PROXY_ENDPOINT=http://s3syncer:8080
      - TEST_S3_ENDPOINT=http://minio1:9000
      - TEST_S3_ENDPOINT2=http://minio2:9000
      - TEST_S3_BUCKET=testsync1
      - TEST_S3_BUCKET2=testsync2
