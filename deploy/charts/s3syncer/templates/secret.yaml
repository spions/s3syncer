{{- if not .Values.existingConfigSecret.name }}
{{- $cfg := mustMergeOverwrite (deepCopy .Values.config) (dict "db_path" "/app/data/s3syncer.db" "mode" .Values.mode) }}
{{- if eq .Values.mode "cluster" }}
{{- $redis := dict "addr" .Values.redis.addr "db" .Values.redis.db "tls" .Values.redis.tls }}
{{- if .Values.redis.username }}{{- $_ := set $redis "username" .Values.redis.username }}{{- end }}
{{- if .Values.redis.keyPrefix }}{{- $_ := set $redis "key_prefix" .Values.redis.keyPrefix }}{{- end }}
{{- $_ := set $cfg "redis" $redis }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3syncer.fullname" . }}
  labels:
    {{- include "s3syncer.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
---
{{- if and .Values.api.token (not .Values.api.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3syncer.fullname" . }}-api
  labels:
    {{- include "s3syncer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.existingSecretKey }}: {{ .Values.api.token | quote }}
{{- end }}
